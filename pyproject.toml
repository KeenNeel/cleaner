[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "cleaner"
version = "0.1.0"
description = "Windows のディスクを安全に自動整理するツール"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["tomli-w>=1.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
cleaner = "cleaner.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
